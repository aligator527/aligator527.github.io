# Deployment is manual on purpose: it is triggered from the Actions tab, never by a push.
# Verify action versions against https://docs.astro.build/en/guides/deploy/github/ before editing.
# Checked 2026-10-23: that page shows checkout@v7, withastro/action@v6 and deploy-pages@v5.
# `node-version` stays at 22 — the action defaults to 24, and CI tests on 22, so the build that
# ships and the build that is tested should be the same one.
#
# This builds with the default base ("/"), which is correct only for the user-site repository
# aligator527.github.io (see ADR-0003). If the site is ever published from a project repository,
# set `BASE_PATH: /<repository-name>` in the build step's env, or every link will 404.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      indexnow:
        description: Which pages to announce to the IndexNow engines after deploying
        type: choice
        default: changed
        options:
          # Pages whose sitemap lastmod is within the last week: a new note, a new lab entry.
          - changed
          # Every URL. For a deploy that changes the whole site — a layout, the dictionaries.
          - all
          - skip

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        # No package-manager input: the action detects pnpm from the lockfile and takes the exact
        # version from package.json `packageManager`. Passing `pnpm@latest` here conflicts with it.
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Bing, Yandex, Seznam, Naver and Yep accept IndexNow; Google does not participate and has no
  # equivalent API. Runs after the deployment and reads the live sitemap, so it can only announce
  # pages that are actually published. A failure here leaves the deployed site untouched.
  indexnow:
    needs: deploy
    if: inputs.indexnow != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # The script installs nothing — it is Node's own fetch and one POST. Left on, the
          # package-manager cache looks for the pnpm in package.json and fails the job for it.
          package-manager-cache: false
      - run: node scripts/indexnow.mjs ${{ inputs.indexnow == 'all' && '--all' || '' }}
