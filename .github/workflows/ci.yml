name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # The whole gate (install, build twice, unit tests, three Playwright projects) runs in a few
    # minutes. A ceiling well above that still stops a hung preview server from burning an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run build
      - run: pnpm run check:links
      # Holds the live, indexed URLs and the font budget. See tests/fixtures/README.md.
      - run: pnpm run check:i18n
      # Proves every internal URL survives deployment under a repository subpath.
      - run: pnpm run build:subpath
      - run: BASE_PATH=/portfolio node scripts/check-links.mjs dist-subpath
      - run: BASE_PATH=/portfolio node scripts/check-i18n.mjs dist-subpath
      # The browser download is ~150 MB and changes only with @playwright/test, so key the cache on
      # the resolved version rather than the lockfile hash.
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # The cache holds the browser, not the apt packages it links against, so those are always
      # installed; it is the download that the cache saves.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
