# Wording approved by Ivan on 2026-09-18. Entries render only when `approved: true`.
# Each principle is framed as a working practice and names the CV evidence it rests on.
#
# `title`, `body` and `evidence` carry one value per locale (see src/utils/localized.ts). The
# Russian is a draft by Claude, reviewed by nobody yet: Russian stays out of INDEXABLE_LOCALES
# until Ivan has read it.
- id: decide-in-writing
  order: 1
  title:
    en: Record decisions where the team can find them
    ru: Фиксируйте решения там, где команда их найдёт
    ja: '決定は、チームが見つけられる場所に残す'
  body:
    en: Architecture decisions, guidelines, and standards are written down so that a choice made once does not have to be re-argued in every review.
    ru: Архитектурные решения, гайдлайны и стандарты записаны, поэтому выбор, сделанный один раз, не приходится заново отстаивать на каждом ревью.
    ja: 'アーキテクチャの決定、ガイドライン、標準は文書に残します。一度決めたことを、レビューのたびに議論し直さずに済むからです。'
  evidence:
    en: Architecture standardization, engineering guidelines, and architecture decisions — Next-Generation WMS.
    ru: Стандартизация архитектуры, инженерные гайдлайны и архитектурные решения — WMS нового поколения.
    ja: 'アーキテクチャ標準化、開発ガイドライン、アーキテクチャ決定 — 次世代WMS。'
  approved: true
- id: prove-before-committing
  order: 2
  title:
    en: Prove risky choices with a small build first
    ru: Проверяйте рискованный выбор небольшим прототипом
    ja: 'リスクの高い選択は、小さく作って先に確かめる'
  body:
    en: When a technology or integration is uncertain, a bounded proof of concept is cheaper than discovering the limitation in production.
    ru: Когда технология или интеграция под вопросом, ограниченный по объёму PoC обходится дешевле, чем обнаружить ограничение уже в продакшене.
    ja: '技術や連携に不確実さがあるとき、範囲を区切ったPoC（技術検証）は、本番で制約に気づくより安く済みます。'
  evidence:
    en: Technical PoCs — Next-Generation WMS and packaging-industry SaaS.
    ru: Технические PoC — WMS нового поколения и SaaS для упаковочной отрасли.
    ja: '技術PoC — 次世代WMSおよび梱包業界向けSaaS。'
  approved: true
- id: review-as-standard-setting
  order: 3
  title:
    en: Use code review to spread standards, not only to catch defects
    ru: Код-ревью распространяет стандарты, а не только ловит дефекты
    ja: 'コードレビューは、欠陥を見つけるだけでなく標準を広める場'
  body:
    en: Reviews are where conventions become shared practice across a team, including external developers.
    ru: Именно на ревью договорённости становятся общей практикой команды — включая внешних разработчиков.
    ja: 'レビューは、外部メンバーを含めたチーム全体で、決めごとが共通の実践に変わる場所です。'
  evidence:
    en: Code reviews and standards — AI chat game platform; reviews and external developer support — packaging-industry SaaS.
    ru: Код-ревью и стандарты — платформа AI-чат-игры; ревью и поддержка внешних разработчиков — SaaS для упаковочной отрасли.
    ja: 'コードレビューと開発標準 — AIチャットゲームプラットフォーム。レビューと外部開発者の支援 — 梱包業界向けSaaS。'
  approved: true
- id: requirements-are-engineering
  order: 4
  title:
    en: Treat requirements as engineering work
    ru: Требования — это инженерная работа
    ja: '要件定義もエンジニアリングの仕事'
  body:
    en: Clarifying what a client or operator needs is part of the system design, not a hand-off that happens before it.
    ru: Выяснить, что нужно клиенту или оператору, — часть проектирования системы, а не этап, который кто-то закрывает до него.
    ja: 'クライアントや現場が何を必要としているかを明確にすることは、システム設計の一部であり、設計の前に終わらせる引き継ぎ作業ではありません。'
  evidence:
    en: Requirements definition and client coordination — Flaretech client projects and freelance work.
    ru: Определение требований и работа с клиентом — клиентские проекты Flaretech и фриланс.
    ja: '要件定義とクライアント折衝 — Flaretechのクライアント案件およびフリーランス業務。'
  approved: true
